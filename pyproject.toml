[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icecode"
version = "0.1.0"
description = "IceCode — Claude Code style Python CLI Agent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.40.0",
  "anthropic>=0.34.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
icecode = "icecode.cli:main"

[tool.setuptools.packages.find]
include = ["icecode*"]
